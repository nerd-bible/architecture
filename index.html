<!doctype html>
<html lang="eng" class="system">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"
    />
    <script type="module" src="./src/index.ts"></script>
    <title>Benchmarks</title>
  </head>
  <body>
    <h1>HTML vs JSON</h1>
    <form id="form">
      <label>
        Trials
        <input name="trials" type="number" value="10" />
      </label>
      <label>
        Compression
        <select name="compression">
          <option value="none" selected>None</option>
          <option value="brotli">Brotli</option>
          <option value="gzip">GZip</option>
          <option value="deflate">Deflate</option>
          <option value="deflate-raw">Deflate raw</option>
          <option value="zstd">ZSTD</option>
        </select>
      </label>
      <label>
        Persistence
        <select name="persistence">
          <option value="none" selected>None</option>
          <option value="localstorage">Local storage</option>
          <option value="idb">idb</option>
          <option value="opfs">OPFS</option>
          <option value="opfs-sync">OPFS (sync)</option>
        </select>
      </label>
      <label>
        <input type="radio" name="format" value="html" checked />HTML
      </label>
      <label> <input type="radio" name="format" value="json" />JSON </label>
      <input type="submit" />
    </form>
    <h2>Results</h2>
    <div id="results"></div>
    <h2>Editor</h2>
    <div id="editor"></div>
  </body>
</html>
